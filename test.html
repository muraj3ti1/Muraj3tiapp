<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص المصحف</title>
<style>
:root{--bg:#f4f6fa;--ink:#0b1a33;--card:#fff;--line:#d5deec;--ok:#0f7a3d;--bad:#b3261e;--mut:#5a6b85}
@media(prefers-color-scheme:dark){:root{--bg:#07122a;--ink:#eaf1ff;--card:#0e2145;--line:#223a68;--ok:#4ade80;--bad:#ff8a80;--mut:#9db0d0}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,Tahoma,sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 12px;color:var(--mut)}
.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.r b{display:block}.ok b{color:var(--ok)}.bad b{color:var(--bad)}
.r span{display:block;font:13px/1.6 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;word-break:break-all;color:var(--mut)}
button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:#1d5fd1;color:#fff;width:100%;margin:6px 0}
</style></head><body>
<h1>فحص تحميل المصحف</h1>
<p>انتظر حتى تكتمل النتائج ثم أرسل لي لقطة شاشة لكل الصفحة، أو اضغط «نسخ النتيجة» والصقها لي.</p>
<div id="out"></div>
<button id="cp" type="button">نسخ النتيجة</button>
<script>
var out=document.getElementById("out"),log=[];
function add(ok,title,detail){
  var d=document.createElement("div");d.className="r "+(ok?"ok":"bad");
  d.innerHTML="<b></b><span></span>";
  d.firstChild.textContent=(ok?"✓ ":"✗ ")+title;
  d.lastChild.textContent=detail||"";
  out.appendChild(d);log.push((ok?"OK  ":"FAIL")+" "+title+" | "+(detail||""));
}
function info(title,detail){var d=document.createElement("div");d.className="r";d.innerHTML="<b></b><span></span>";d.firstChild.textContent=title;d.lastChild.textContent=detail||"";out.appendChild(d);log.push("INFO "+title+" | "+(detail||""))}
function base(p){return new URL(p,location.href).href}
function msg(e){return String(e&&e.message||e)}

info("العنوان",location.href);
var ua=navigator.userAgent;
var inApp=/Instagram|FBAN|FBAV|FB_IAB|Line\/|Snapchat|TikTok|Twitter/i.test(ua);
info("المتصفح",ua);
add(!inApp,inApp?"أنت داخل متصفح تطبيق (إنستغرام أو غيره)":"متصفح عادي","افتح الرابط من Safari مباشرة");
add("serviceWorker" in navigator,"دعم الـ service worker",("serviceWorker" in navigator)?("controller: "+(navigator.serviceWorker.controller?"نعم":"لا")):"غير مدعوم");
add(!!window.caches,"دعم الذاكرة المؤقتة (caches)","");
add(!!window.FontFace,"دعم FontFace","");

function fetchTest(n){
  var name="fonts/p"+("00"+n).slice(-3)+".woff",u=base(name),t0=Date.now();
  return fetch(u).then(function(r){
    var ct=r.headers.get("content-type")||"-";
    if(!r.ok){add(false,"تنزيل "+name,"HTTP "+r.status+" | "+u);return null}
    return r.arrayBuffer().then(function(b){
      var m=String.fromCharCode.apply(null,new Uint8Array(b.slice(0,4)));
      var ok=m==="wOFF"&&b.byteLength>1000;
      add(ok,"تنزيل "+name,"HTTP "+r.status+" | "+b.byteLength+" بايت | "+ct+" | بداية الملف: "+m+" | "+(Date.now()-t0)+"ms");
      return ok?b:null;
    });
  }).catch(function(e){add(false,"تنزيل "+name,msg(e)+" | "+u);return null});
}
function bufLoad(n,b){
  if(!b)return Promise.resolve();
  var ff;try{ff=new FontFace("T"+n,b)}catch(e){add(false,"تسجيل الخط من الذاكرة (صفحة "+n+")",msg(e));return Promise.resolve()}
  return ff.load().then(function(){document.fonts.add(ff);add(true,"تسجيل الخط من الذاكرة (صفحة "+n+")","")}).catch(function(e){add(false,"تسجيل الخط من الذاكرة (صفحة "+n+")",msg(e))});
}
function urlLoad(n){
  var ff;try{ff=new FontFace("U"+n,"url('"+base("fonts/p"+("00"+n).slice(-3)+".woff")+"')")}catch(e){add(false,"تحميل الخط بالرابط (صفحة "+n+")",msg(e));return Promise.resolve()}
  var t0=Date.now(),done=false;
  var to=new Promise(function(res){setTimeout(function(){if(!done){add(false,"تحميل الخط بالرابط (صفحة "+n+")","لم يستجب خلال ١٥ ثانية");}res()},15000)});
  var ld=ff.load().then(function(){done=true;add(true,"تحميل الخط بالرابط (صفحة "+n+")",(Date.now()-t0)+"ms")}).catch(function(e){done=true;add(false,"تحميل الخط بالرابط (صفحة "+n+")",msg(e))});
  return Promise.race([ld,to]);
}

fetch(base("manifest.json")).then(function(r){add(r.ok,"ملف manifest.json","HTTP "+r.status)}).catch(function(e){add(false,"ملف manifest.json",msg(e))})
.then(function(){return fetch(base("sw.js")).then(function(r){return r.text().then(function(t){var v=(t.match(/VERSION\s*=\s*"([^"]+)"/)||[])[1];add(r.ok,"ملف sw.js","HTTP "+r.status+" | الإصدار المنشور: "+(v||"?"))})}).catch(function(e){add(false,"ملف sw.js",msg(e))})})
.then(function(){return fetchTest(1)}).then(function(b){return bufLoad(1,b)})
.then(function(){return urlLoad(1)})
.then(function(){return fetchTest(2)}).then(function(b){return bufLoad(2,b)})
.then(function(){return fetchTest(3)})
.then(function(){return fetchTest(604)})
.then(function(){info("انتهى الفحص","أرسل لي لقطة الشاشة كاملة")});

document.getElementById("cp").onclick=function(){
  var t=log.join("\n");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert("تم النسخ")},function(){prompt("انسخ النص:",t)})}
  else prompt("انسخ النص:",t);
};
</script></body></html>
